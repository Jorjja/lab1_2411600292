<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Nexus Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="#">Nexus Admin Dashboard</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        <div class="greeting-box">
            <h3 id="greeting">Welcome!</h3>
            <p class="mb-0">Here's what's happening with your system today.</p>
        </div>

        <section class="mb-4">
            <div class="row g-4">
                <div class="col-md-3 col-sm-6">
                    <div class="card stat-card p-3">
                        <h5 class="card-title" id="stat1-title">Total Users</h5>
                        <p class="card-text" id="stat1-value">0</p>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="card stat-card p-3">
                        <h5 class="card-title" id="stat2-title">Active Sessions</h5>
                        <p class="card-text" id="stat2-value">0</p>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="card stat-card p-3">
                        <h5 class="card-title" id="stat3-title">System Status</h5>
                        <p class="card-text" id="stat3-value">--</p>
                    </div>
                </div>
                <div class="col-md-3 col-sm-6">
                    <div class="card stat-card p-3">
                        <h5 class="card-title" id="stat4-title">Notifications</h5>
                        <p class="card-text" id="stat4-value">0</p>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <h4 class="mb-3">Recent Activity</h4>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Action</th>
                            <th>Details</th>
                            <th>Date & Time</th>
                        </tr>
                    </thead>
                    <tbody id="activityTable">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="text-center py-3 mt-5 text-muted">
        <p class="mb-0">© 2026 Nexus Admin Dashboard. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
