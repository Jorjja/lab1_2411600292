<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | [Vitality Fitness Hub]</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">

                    <div class="card login-card shadow-lg">
                        <div class="card-header text-center theme-header">
                            <h3 class="mb-0">[Your Theme Name]</h3>
                            <p class="mb-0 small">Secure Login System</p>
                        </div>

                        <div class="card-body p-4">
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                                </div>

                                <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                                    Invalid username or password!
                                </div>

                                <div class="d-grid">
                                    <button type="button" id="loginBtn" class="btn btn-primary btn-lg">Login</button>
                                </div>
                            </form>
                            <p class="text-center mt-3 small text-muted">Demo: admin / password123</p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/login.js"></script>
</body>
</html>
