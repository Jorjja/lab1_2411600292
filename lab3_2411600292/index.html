<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Joseph Fitness Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-wrapper d-flex justify-content-center align-items-center">
        <div class="login-card shadow-lg" style="max-width: 420px; width: 100%;">
            <div class="theme-header">
                <h2 class="mb-0">💪 Joseph Fitness Tracker</h2>
                <p class="mb-0 mt-2 opacity-75">Your Daily Progress, Powered by You</p>
            </div>
            <div class="card-body p-4">
                <h5 class="text-center mb-4">Sign In</h5>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                        ❌ Invalid username or password
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Login to Dashboard</button>
                </form>
                <p class="text-center mt-4 small text-muted">Demo: Username: <strong>admin</strong> | Password: <strong>password123</strong></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
